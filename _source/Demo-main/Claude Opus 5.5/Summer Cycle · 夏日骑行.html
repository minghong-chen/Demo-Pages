      <script>
        // Watercolour wash, painted small and stretched (the soft upscale is the look). Runs before the bundle loads.
        (function () {
          var c = document.getElementById("wash");
          function paint() {
            var W0 = 384, w = 640, h = Math.max(250, Math.round((w * innerHeight) / innerWidth));
            c.width = w; c.height = h;
            var g = c.getContext("2d", { willReadFrequently: true }), s = 11;
            g.save(); g.scale(w / W0, w / W0); var H0 = h * W0 / w; var rh = h; h = H0; w = W0;
            var rnd = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
            var gr = g.createLinearGradient(0, 0, 0, h);
            gr.addColorStop(0, "#b7d9d8"); gr.addColorStop(0.3, "#d8e8dd"); gr.addColorStop(0.55, "#f3ecd9");
            gr.addColorStop(1, "#efe1c3");
            g.fillStyle = gr; g.fillRect(0, 0, w, h);
            // Pigment blotches: stronger toward the rim, like drying watercolour.
            function blot(x, y, r, col, a) {
              var q = g.createRadialGradient(x, y, 0, x, y, r);
              q.addColorStop(0, "rgba(" + col + "," + a * 0.5 + ")"); q.addColorStop(0.82, "rgba(" + col + "," + a + ")");
              q.addColorStop(1, "rgba(" + col + ",0)");
              g.fillStyle = q; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
            }
            for (var i = 0; i < 22; i++) blot(rnd() * w, rnd() * h * 0.42, 18 + rnd() * 50, rnd() < 0.5 ? "110,170,182" : "150,196,196", 0.05 + rnd() * 0.07);
            for (var j = 0; j < 18; j++) blot(rnd() * w, h * (0.5 + rnd() * 0.5), 20 + rnd() * 55, rnd() < 0.6 ? "226,196,146" : "240,222,190", 0.05 + rnd() * 0.08);
            // Two soft summer cumulus.
            function cloud(cx, cy, sc) {
              // Cauliflower lobes piled on a flat base (clipped), lit from the upper right.
              g.save(); g.beginPath(); g.rect(cx - 80 * sc, cy - 80 * sc, 160 * sc, 80 * sc + 1.5 * sc); g.clip();
              var lobes = [[-30, 0, 11], [-18, -6, 14], [-4, -13, 17], [12, -9, 15], [25, -2, 12], [-9, -24, 11], [6, -25, 10], [34, 1, 8], [-40, 2, 7]];
              for (var k = 0; k < lobes.length; k++) {
                var x = cx + lobes[k][0] * sc, y = cy + lobes[k][1] * sc, r = lobes[k][2] * sc * (0.92 + rnd() * 0.16);
                var q = g.createRadialGradient(x + r * 0.3, y - r * 0.4, 0, x, y, r);
                q.addColorStop(0, "rgba(255,253,247,0.9)"); q.addColorStop(0.6, "rgba(246,246,242,0.72)");
                q.addColorStop(0.86, "rgba(214,220,232,0.35)"); q.addColorStop(1, "rgba(214,220,232,0)");
                g.fillStyle = q; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
              }
              g.restore();
              // Cool lavender underside, a soft flattened ellipse (no hard edge).
              g.save(); g.translate(cx, cy + 3 * sc); g.scale(1, 0.22);
              var b = g.createRadialGradient(0, 0, 0, 0, 0, 36 * sc);
              b.addColorStop(0, "rgba(170,180,208,0.3)"); b.addColorStop(1, "rgba(170,180,208,0)");
              g.fillStyle = b; g.beginPath(); g.arc(0, 0, 36 * sc, 0, 7); g.fill(); g.restore();
            }
            cloud(w * 0.16, h * 0.24, 1.35); cloud(w * 0.8, h * 0.15, 0.95);
            // A far blue ridge and a paddy line, very pale, behind the road.
            var rg = g.createLinearGradient(0, h * 0.5, 0, h * 0.7);
            rg.addColorStop(0, "rgba(128,158,178,0.2)"); rg.addColorStop(0.55, "rgba(128,158,178,0.12)"); rg.addColorStop(1, "rgba(128,158,178,0)");
            g.fillStyle = rg; g.beginPath(); g.moveTo(0, h * 0.7);
            for (var x = 0; x <= w; x += 6) g.lineTo(x, h * 0.6 - 8 - 9 * Math.sin(x * 0.021 + 1) - 5 * Math.sin(x * 0.057 + 2));
            g.lineTo(w, h * 0.7); g.fill();
            var p = g.createLinearGradient(0, h * 0.6, 0, h * 0.72);
            p.addColorStop(0, "rgba(150,180,120,0)"); p.addColorStop(0.5, "rgba(150,180,120,0.1)"); p.addColorStop(1, "rgba(150,180,120,0)");
            g.fillStyle = p; g.fillRect(0, h * 0.6, w, h * 0.12);
            // A pale telephone pole with sagging wires, far right.
            g.strokeStyle = "rgba(96,112,128,0.26)"; g.lineCap = "round";
            var px = w * 0.875, pt = h * 0.2, pb = h * 0.66;
            g.lineWidth = 1.6; g.beginPath(); g.moveTo(px, pt); g.lineTo(px + 1, pb); g.stroke();
            g.lineWidth = 1.1; g.beginPath(); g.moveTo(px - 9, pt + 6); g.lineTo(px + 9, pt + 5); g.moveTo(px - 6, pt + 12); g.lineTo(px + 7, pt + 11.5); g.stroke();
            g.lineWidth = 0.55; g.strokeStyle = "rgba(90,104,120,0.3)";
            for (var wi = 0; wi < 3; wi++) {
              var y0 = pt + 6 + wi * 3;
              g.beginPath(); g.moveTo(px - 8 + wi * 7, y0); g.quadraticCurveTo(px * 0.55, y0 + 26 + wi * 4, -10, y0 - 14 + wi * 6); g.stroke();
              g.beginPath(); g.moveTo(px - 8 + wi * 7, y0); g.quadraticCurveTo(px + 30, y0 + 8, w + 10, y0 + 2 + wi * 2); g.stroke();
            }
            // Summer grass washes in the bottom corners.
            for (var gi = 0; gi < 26; gi++) {

            }
            g.lineWidth = 0.8;
            for (var bi = 0; bi < 140; bi++) {
              var sd = bi % 2, edge = Math.pow(rnd(), 1.6), bx = sd ? w - edge * w * 0.3 : edge * w * 0.3;
              var bh = (1 - edge) * (14 + rnd() * 22), by = h + 2, lean = (sd ? -1 : 1) * (2 + rnd() * 6);
              g.strokeStyle = "rgba(" + (rnd() < 0.5 ? "72,110,64" : "98,138,76") + "," + (0.18 + rnd() * 0.2) + ")";
              g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + lean * 0.3, by - bh * 0.6, bx + lean, by - bh); g.stroke();
            }
            var v = g.createRadialGradient(w / 2, h * 0.52, h * 0.35, w / 2, h * 0.52, w * 0.62);
            v.addColorStop(0, "rgba(120,88,50,0)"); v.addColorStop(1, "rgba(120,88,50,0.2)");
            g.fillStyle = v; g.fillRect(0, 0, w, h);
            g.restore(); w = c.width; h = rh;
            // Dither: breaks up 8-bit gradient steps once the canvas is stretched.
            var id = g.getImageData(0, 0, w, h), d = id.data;
            for (var di = 0; di < d.length; di += 4) { var nz = (rnd() - 0.5) * 3.2; d[di] += nz; d[di + 1] += nz; d[di + 2] += nz; }
            g.putImageData(id, 0, 0);
            var el = document.getElementById("loader");
            el.style.setProperty("--s", String(Math.max(0.6, Math.min(1.15, innerHeight / 950, innerWidth / 1680))));
          }
          paint();
          window.__paintWash = paint;
        })();
